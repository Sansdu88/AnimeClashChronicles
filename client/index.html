<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Anime Clash Chronicles</title>
    <meta name="description" content="Open unlimited manga-style booster packs of anime cards built from Wikipedia.">
    <meta name="theme-color" content="#e63946">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;600;800;900&display=swap">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/card.css">
    <link rel="stylesheet" href="css/booster.css">
    <link rel="stylesheet" href="css/views.css">
    <link rel="stylesheet" href="css/colorblind.css">
    <script type="module" src="js/main.js"></script>
  </head>
  <body class="is-logged-out">
    <a class="skip-link" href="#main" data-i18n="app.skip">Skip to content</a>

    <header class="topbar">
      <a class="logo" href="#/" aria-label="Anime Clash Chronicles">
        <span class="logo__main">ANIME CLASH<span class="logo__accent">CHRONICLES</span></span>
      </a>
      <nav class="nav" aria-label="Main" data-i18n-aria="nav.main">
        <a href="#/" data-route="open"><span class="nav__icon" aria-hidden="true">🎴</span><span data-i18n="nav.open">Open</span><span class="nav__badge nav__badge--stock" id="open-badge" hidden></span></a>
        <a href="#/daily" data-route="daily"><span class="nav__icon" aria-hidden="true">🎁</span><span data-i18n="nav.daily">Daily</span><span class="nav__badge nav__badge--daily" id="daily-badge" hidden>!</span></a>
        <a href="#/market" data-route="market"><span class="nav__icon nav__icon--kira" aria-hidden="true">✦</span><span data-i18n="nav.market">Market</span></a>
        <a href="#/collection" data-route="collection"><span class="nav__icon" aria-hidden="true">📚</span><span data-i18n="nav.collection">Collection</span></a>
        <a href="#/friends" data-route="friends"><span data-i18n="nav.friends">Friends</span><span class="nav__badge" id="friends-badge" hidden></span></a>
        <a href="#/trades" data-route="trades"><span data-i18n="nav.trades">Trades</span><span class="nav__badge" id="trades-badge" hidden></span></a>
        <a href="#/stats" data-route="stats"><span data-i18n="nav.stats">Stats</span></a>
        <a href="#/rules" data-route="rules"><span data-i18n="nav.rules">Rules</span></a>
        <a href="#/admin" data-route="admin" id="admin-link" hidden><span data-i18n="nav.admin">Admin</span></a>
        <!-- Phones: the other pages and the settings are in the "More" sheet -->
        <button class="nav__more" id="nav-more" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="more-sheet">
          <span class="nav__icon" aria-hidden="true">☰</span><span data-i18n="nav.more">More</span><span class="nav__badge" id="more-badge" hidden></span>
        </button>
      </nav>
      <div class="topbar__side">
        <div class="lang-switch" role="group" aria-label="Language" data-i18n-aria="header.language">
          <button type="button" data-lang="en" lang="en" aria-pressed="false">EN</button>
          <button type="button" data-lang="fr" lang="fr" aria-pressed="false">FR</button>
        </div>
        <a class="kira-chip" id="kira-chip" href="#/market" data-i18n-title="header.kira">
          <span class="kira-coin" aria-hidden="true">✦</span>
          <span class="kira-chip__amount" id="kira-balance">0</span>
          <span class="sr-only" data-i18n="header.kiraUnit">Kira</span>
        </a>
        <button class="player-chip" id="player-chip" type="button" data-i18n-title="header.rename">
          <span aria-hidden="true">👤</span>
          <span class="player-chip__name" id="player-name">…</span>
          <span class="player-chip__progress" id="player-progress" data-i18n-title="header.progress"></span>
        </button>
        <button class="icon-btn" id="sound-toggle" type="button" aria-pressed="true" data-i18n-aria="header.sound">🔊</button>
        <button class="icon-btn icon-btn--toggle" id="colorblind-toggle" type="button" aria-pressed="false" data-i18n-aria="header.colorblind">👁</button>
        <button class="icon-btn icon-btn--logout" id="logout" type="button" data-i18n-aria="header.logout" data-i18n-title="header.logout">⏻</button>
      </div>
    </header>

    <!-- The latest drops of the players (components/drops.js) -->
    <section class="drops" id="drops" hidden aria-labelledby="drops-label">
      <p class="drops__label" id="drops-label"><span class="drops__dot" aria-hidden="true"></span><span class="drops__long" data-i18n="drops.label">Live drops</span><span class="drops__short" data-i18n="drops.short">Live</span></p>
      <div class="drops__viewport"><div class="drops__track"></div></div>
    </section>

    <!-- Phones: the sheet of the "More" tab (main.js) -->
    <div class="sheet" id="more-sheet" hidden>
      <div class="sheet__backdrop" data-close-sheet></div>
      <div class="sheet__panel" role="dialog" aria-modal="true" aria-label="Menu" data-i18n-aria="nav.menu" tabindex="-1">
        <span class="sheet__grip" aria-hidden="true"></span>
        <button class="sheet__player" type="button" data-proxy="player-chip">
          <span class="sheet__avatar" aria-hidden="true">👤</span>
          <span class="sheet__who"><b id="sheet-player-name">…</b><span id="sheet-player-progress"></span></span>
          <span class="sheet__edit" data-i18n="nav.rename">Rename</span>
        </button>
        <nav class="sheet__links" aria-label="Other pages" data-i18n-aria="nav.morePages">
          <a href="#/friends" data-route="friends"><span aria-hidden="true">👥</span><span data-i18n="nav.friends">Friends</span><span class="nav__badge" id="sheet-friends-badge" hidden></span></a>
          <a href="#/trades" data-route="trades"><span aria-hidden="true">🔄</span><span data-i18n="nav.trades">Trades</span><span class="nav__badge" id="sheet-trades-badge" hidden></span></a>
          <a href="#/stats" data-route="stats"><span aria-hidden="true">📊</span><span data-i18n="nav.stats">Stats</span></a>
          <a href="#/rules" data-route="rules"><span aria-hidden="true">📖</span><span data-i18n="nav.rules">Rules</span></a>
          <a href="#/admin" data-route="admin" id="sheet-admin-link" hidden><span aria-hidden="true">⚙️</span><span data-i18n="nav.admin">Admin</span></a>
        </nav>
        <div class="sheet__settings">
          <div class="lang-switch" role="group" aria-label="Language" data-i18n-aria="header.language">
            <button type="button" data-lang="en" lang="en" aria-pressed="false">EN</button>
            <button type="button" data-lang="fr" lang="fr" aria-pressed="false">FR</button>
          </div>
          <button class="sheet__setting" type="button" data-proxy="sound-toggle" aria-pressed="true"><span data-sound-icon aria-hidden="true">🔊</span><span data-i18n="header.sound">Sound</span></button>
          <button class="sheet__setting" type="button" data-proxy="colorblind-toggle" aria-pressed="false"><span aria-hidden="true">👁</span><span data-i18n="header.colorblind">Colorblind mode</span></button>
          <button class="sheet__setting sheet__setting--logout" type="button" data-proxy="logout"><span aria-hidden="true">⏻</span><span data-i18n="header.logout">Log out</span></button>
        </div>
      </div>
    </div>

    <main id="main" class="page" tabindex="-1"></main>

    <footer class="footer" id="footer"></footer>

    <div id="toasts" class="toasts" aria-live="polite"></div>
  </body>
</html>
